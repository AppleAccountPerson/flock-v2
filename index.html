<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuN13</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Calligraffitti&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
 :root { --maroon: #9c2a2a; --red: #ff1a1a; }
 * { margin:0; padding:0; box-sizing:border-box; }
 body { font-family: system-ui, sans-serif; background: #050505; color: #ddd; overflow-x: hidden; }






 .ambient-bg, .scanline { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
 .ambient-bg {
     background: linear-gradient(rgba(156,42,42,0.09) 1px, transparent 1px),
                 linear-gradient(90deg, rgba(156,42,42,0.09) 1px, transparent 1px);
     background-size: 80px 80px;
     animation: gridMove 45s linear infinite;
     opacity: 0.7;
 }
 .scanline {
     background: linear-gradient(transparent, rgba(255,26,26,0.2), transparent);
     background-size: 100% 300%;
     animation: scan 9s linear infinite;
     opacity: 0.2;
 }
 @keyframes gridMove { to { background-position: 80px 80px; } }
 @keyframes scan { to { background-position: 0 300%; } }








 .particle { position: fixed; border-radius: 50%; pointer-events: none; z-index: -1; animation: floatParticle linear infinite; }






 #loader { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; transition: opacity 1.4s ease; }
 .loader { width: 160px; height: 160px; border-radius: 50%; position: relative; box-shadow: 0 0 40px 6px rgba(0,0,0,0.6) inset; overflow: hidden; rotate: 180deg}
 .loader:before, .loader:after { content: ""; position: absolute; width: 90%; height: 90%; border-radius: 45%; top: -40%; background: #2e2e2e; animation: wave 11s linear infinite; }
 .loader:before { border-radius: 35%; background: rgba(156,42,42,0.45); animation-duration: 5s; }
 @keyframes wave { to { transform: rotate(1000deg) scale(6); } }






 .nav-btn{ opacity:"0.1"; font-size:2.5rem; cursor:pointer; transition: all 0.2s ease;}
 .nav-btn:hover{transform: scaleX(1.2) scaleY(0.95) translateX(5px) translateY(-5px) rotate(-90deg)}








 nav { position: fixed; top:0; left:0; right:0; z-index: 2000; padding: 1.5rem 8%; background: rgba(5,5,5,0.95); backdrop-filter: blur(16px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(156,42,42,0.3); }
 .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: -4px; cursor: pointer; }








 /* Prettier Nav */
 .fullscreen-nav {
     position: fixed; inset: 0; background: rgba(5,5,5,0.97); z-index: 3000;
     display: none; flex-direction: column; align-items: left; justify-content: left;
     gap: 2rem; font-size: 3.4rem; font-weight: 700;
     opacity: 0; transform: scale(0.85) translateY(60px); transition: all 0.8s cubic-bezier(0.23,1,0.32,1);
 }
 .fullscreen-nav.show { display: flex; opacity: 1; transform: scale(1) translateY(100px); }
 .fullscreen-nav a {
     padding: 0px 60px; border-radius: 20px; background: rgba(30,30,30,0.8);
     backdrop-filter: blur(12px); transition: all 0.4s ease; border: 1px solid rgba(156,42,42,0.4);
     color: white; text-decoration: none;
 }
 .fullscreen-nav a:hover {
     background: rgba(156,42,42,0.5); color: white; transform: scale(1.01) translateX(50px);
 }








 .hero {
     height: 100vh; display: flex; align-items: center; justify-content: center;
     text-align: center; position: relative; overflow: hidden; opacity: 0; transition: opacity 1.2s ease;
 }
 .hero.visible { opacity: 1; }






 /* Graffiti-style Logo Font */
 .logo-text {
     font-size: 8.8rem; font-weight: 900; letter-spacing: 10px;
     background: linear-gradient(90deg, #ffffff, #ff4444, #ffffff);
     -webkit-background-clip: text; -webkit-text-fill-color: opaque;
     text-shadow: 0 0 60px rgba(255,30,30,0.9),
                  8px 8px 0 #000,
                  -4px -4px 0 #000;
     font-family: 'Audiowide', 'Rubik Glitch', sans-serif;
     transform: skew(-20deg);
     filter: drop-shadow(4px 4px 8px #000);
 }








 .te-btn {
     padding: 18px 32px; font-size: 1.1rem; font-weight: bold;
     background: #555555; color: #ffffff; border: none; border-radius: 12px;
     box-shadow: 6px 6px 12px rgba(0,0,0,0.5), inset 2px 2px 4px #fff, inset -4px -4px 8px #c7c3c0;
     cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px;
 }
 .te-btn:hover { transform: translateY(-3px) translatex(-3px) scale(1.03) rotate(-2deg); }






      .teaser-btn {
     padding: 18px 32px; font-size: 1.1rem; font-weight: bold;
     background: #555555; color: #ffffff; border: none; border-radius: 12px;
     box-shadow: 6px 6px 12px rgba(0,0,0,0.5), inset 2px 2px 4px #fff, inset -4px -4px 8px #c7c3c0;
     cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px;
 }
 .teaser-btn:hover { transform: translateY(3px) translatex(3px) scale(1.03) rotate(4deg); }




 .gold-btn {
     margin-left: 300px; margin-top: 50px; padding: 20px 48px; font-size: 1.25rem; font-weight: bold;
     background: linear-gradient(145deg, #f1c40f, #d4af37);
     color: #111; border: none; border-radius: 50px;
     box-shadow: 0 0 45px #f1c40f, 0 0 80px rgba(241,196,15,0.6);
     cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
 }
 .gold-btn:hover { transform: translateY(3px) translatex(-20px) scale(1.1) rotate(-4deg); }








 section {
     padding: 180px 10%; scroll-margin-top: 100px;
     opacity: 0; transform: translateY(60px); transition: all 1.1s cubic-bezier(0.23,1,0.32,1);
     position: relative; z-index: 2;
 }
 section.visible { opacity: 1; transform: translateY(0); }












 .card {
     background: rgba(17,17,17,0.85); border: 1px solid #333; border-radius: 24px;
     padding: 2.8rem; backdrop-filter: blur(8px);
     transition: all 0.8s cubic-bezier(0.23,1,0.32,1);
 }
 .card:hover {
     transform: translateY(-10px) rotate(1deg);
     border-color: var(--red);
     box-shadow: 0 40px 80px rgba(156,42,42,0.35);
 }
</style>
</head>
<body>




<div class="ambient-bg"></div>
<div class="scanline"></div>






<!-- ==================== CONFIGURATION ==================== -->
<script src="config.js"></script>




<!-- Loader -->
<div id="loader">
<div class="loader"></div>
<div style="font-size:2.8rem; font-weight:900; color:var(--red);">Loading...</div>
</div>


<!-- Nav -->
<nav>
<div class="logo" onclick="document.getElementById('home').scrollIntoView({behavior:'smooth'})">RuN13</div>
<div class="nav-btn" onclick="toggleNav()">☰</div>
</nav>


<!-- Fullscreen Nav -->
<div id="fullNav" class="fullscreen-nav">
<a href="#about" onclick="navigateTo('#about')">BIO</a>
<a href="#releases" onclick="navigateTo('#releases')">RELEASES</a>
<a href="#visuals" onclick="navigateTo('#visuals')">VISUALS</a>
<a href="#live" onclick="navigateTo('#live')" id="nav-countdown">NEXT DROP</a>
<a href="#merch" onclick="navigateTo('#merch')">MERCH</a>
<a href="#contact" onclick="navigateTo('#contact')">CONNECT</a>
</div>


<!-- Hero -->
<section class="hero" id="home">
<div style="text-align:center; z-index:2">
 <h1 class="logo-text">RuN13</h1>


 <!-- dynamic text -->
 <p id="heroSubtitle" style="font-size:2rem; margin:30px 0 40px; color:#bbb;">
    Flock Talk
 </p>


 <button class="teaser-btn" onclick="playTeaser()">
    <i class="fas fa-play"></i> Lil' teaser
 </button>




 <button onclick="goToNextDrop()" id="hero-nextdrop-btn" class="gold-btn" style="display:none;">
     <i class="fas fa-fire"></i> COUNTDOWN
 </button>
</div>
</section>


<!-- About -->
<section id="about">
<h2 style="text-align:center; font-size:4rem; margin-bottom:4rem;">Bio</h2>
<div class="card" style="max-width:1000px; margin:0 auto; line-height:1.7;" id="bio-content"></div>
</section>








<!-- Releases -->
<section id="releases">
<h2 style="text-align:center; font-size:4rem; margin-bottom:4rem;">Releases</h2>
<div id="releases-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(360px,1fr)); gap:3rem;"></div>
</section>










<!-- Visuals -->
<section id="visuals">
<h2 style="text-align:center; font-size:4rem; margin-bottom:4rem;">Visual Realm</h2>
<div id="visuals-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(340px,1fr)); gap:2.5rem;"></div>
</section>












<!-- Next Drop -->
<section id="live" style="display: none;">
<h2 style="font-size:4rem; margin-bottom:3rem; text-align:center;">Next Drop</h2>
<div class="card" style="max-width:800px; margin:0 auto; text-align:center;">
 <h3 id="next-drop-name" style="margin-bottom:20px;"></h3>
 <p id="next-drop-desc" style="color:#aaa; margin-bottom:30px;"></p>
 <div id="countdown" style="font-size:5rem; font-weight:900; color:var(--red); letter-spacing:6px;"></div>
</div>
</section>






<!-- Merch -->
<section id="merch">
<h2 style="text-align:center; font-size:4rem; margin-bottom:4rem;">Merch</h2>
<div class="card" style="max-width:800px; margin:0 auto; text-align:center;">
 <h3>THE FLOCK STOCK</h3>
 <p style="margin:30px 0; font-size:1.2rem;">Limited edition gear dropping soon.</p>
 <button class="te-btn" onclick="alert('AThis button doesn't work yet lol 🐔')">Join the Waitlist</button>
</div>
</section>








<!-- Contact -->
<section id="contact">
<h2 style="text-align:center; font-size:4rem; margin-bottom:4rem;">Connect</h2>
<div style="max-width:600px; margin:0 auto; text-align:center;">
 <p style="font-size:1.5rem; margin-bottom:40px;">Stay in the frequency</p>
 <input id="subscribeEmailInput" type="email" placeholder="your@email.com" style="padding:18px; width:70%; background:#111; border:1px solid #444; color:white; border-radius:50px; font-size:1.1rem;">
 <button class="te-btn" style="margin-left:175px; margin-top:20px;" onclick="subscribe()">Subscribe</button>
</div>
</section>






<script>
// Use CONFIG
function renderReleases() {
document.getElementById('releases-grid').innerHTML = CONFIG.releases.map(r => `
 <div class="card">
     <h3>${r.title}</h3>
     <p style="margin:15px 0 25px; color:#aaa;">${r.type}</p>
     <div style="display:flex; gap:12px; flex-wrap:wrap;">
         <button class="te-btn" onclick="window.open('${r.spotify}')"><i class="fab fa-spotify"></i> Spotify</button>
         <button class="te-btn" onclick="window.open('${r.apple}')"><i class="fab fa-apple"></i> Music</button>
         <button class="te-btn" onclick="window.open('${r.youtube}')"><i class="fab fa-youtube"></i> YouTube</button>
     </div>
 </div>
`).join('');
}






function renderVisuals() {
document.getElementById('visuals-grid').innerHTML = CONFIG.visuals.map(v => `
 <div class="card">
     <h3>${v.title}</h3>
     <p>${v.desc}</p>
 </div>
`).join('');
}


function createParticle(color = '#ff1a1a') {
const p = document.createElement('div');
p.classList.add('particle');
const size = Math.random() * 8 + 5;
p.style.width = `${size}px`;
p.style.height = `${size}px`;
p.style.background = `radial-gradient(circle, ${color}, transparent)`;
p.style.boxShadow = `0 0 25px ${color}`;
p.style.left = `${Math.random() * 100}vw`;
p.style.top = `${Math.random() * 40 + 55}vh`;
p.style.animationDuration = `${Math.random() * 10 + 8}s`;
document.body.appendChild(p);
setTimeout(() => p.remove(), 28000);
}




function toggleNav() { document.getElementById('fullNav').classList.toggle('show'); }






function navigateTo(section) {
toggleNav();
setTimeout(() => document.querySelector(section).scrollIntoView({ behavior: 'smooth' }), 500);
}








function goToNextDrop() {
document.getElementById('live').scrollIntoView({ behavior: 'smooth' });
}




function playTeaser() {
alert("Some audio plays...");
}


const heroPhrases = [
"Big Chicken Boi",
"Flock Talk",
"Nest Fest",
"Eg Omlet",
"Ruffled Feathers",
"Funny Chicken Pun"
];




window.addEventListener("load", () => {
const element = document.getElementById("heroSubtitle");






const randomPhrase =
heroPhrases[Math.floor(Math.random() * heroPhrases.length)];










element.textContent = randomPhrase;
});






function subscribe() {
if (document.getElementById('subscribeEmailInput').value.includes("@gmail.com")) {
alert("This button doesn't work, but you would've subscribed with " + document.getElementById('subscribeEmailInput').value);
} else if (document.getElementById('subscribeEmailInput').value.includes("@outlook.com")){
alert("This button doesn't work, but you would've subscribed with " + document.getElementById('subscribeEmailInput').value);
}else if (document.getElementById('subscribeEmailInput').value.includes("@hotmail.com")){
alert("This button doesn't work, but you would've subscribed with " + document.getElementById('subscribeEmailInput').value);
}else{
alert("Please use a valid email!")
}
}












function initCountdown() {
const container = document.getElementById('live');
const heroBtn = document.getElementById('hero-nextdrop-btn');








if (!CONFIG.showCountdown) {
 container.style.display = 'none';
 document.getElementById('nav-countdown').style.display = 'none';
 heroBtn.style.display = 'none';
 return;
}
















container.style.display = 'block';
document.getElementById('nav-countdown').style.display = 'block';
heroBtn.style.display = 'inline-flex';






document.getElementById('next-drop-name').textContent = CONFIG.nextDropName;
document.getElementById('next-drop-desc').textContent = CONFIG.nextDropDescription;




const target = new Date(CONFIG.countdownTarget).getTime();
setInterval(() => {
 const dist = target - Date.now();
 if (dist < 0) return document.getElementById('countdown').innerHTML = "OUT NOW 🔥";
 const d = Math.floor(dist / 86400000);
 const h = Math.floor((dist % 86400000) / 3600000);
 const m = Math.floor((dist % 3600000) / 60000);
 const s = Math.floor((dist % 60000) / 1000);
 document.getElementById('countdown').innerHTML = `${d}d ${h}h ${m}m ${s}s`;
}, 1000);
}








window.onload = () => {
document.getElementById('bio-content').innerHTML = CONFIG.bio;
renderReleases();
renderVisuals();
initCountdown();












setTimeout(() => {
 document.getElementById('loader').style.opacity = '0';
 setTimeout(() => {
     document.getElementById('loader').style.display = 'none';
     document.querySelector('.hero').classList.add('visible');
 }, 800);
}, 1600);




























// Golden particles around Next Drop button
setInterval(() => {
 if (document.getElementById('hero-nextdrop-btn').style.display !== 'none') {
     createParticle('#ffd700');
 }
}, 140);












setInterval(() => createParticle(), 320);
for(let i = 0; i < 12; i++) createParticle();












window.addEventListener('scroll', () => {
 document.querySelectorAll('section').forEach(sec => {
     if (sec.getBoundingClientRect().top < window.innerHeight * 0.78) {
         sec.classList.add('visible');
     }
 });
});
};
</script>
</body>
</html>
